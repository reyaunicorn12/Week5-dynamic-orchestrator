<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Orchestrator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #004cff;
        color: #ff06ee;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        min-height: 100vh;
      }
      .panel {
        padding: 16px;
        border-right: 1px solid #334155;
      }
      .panel:last-child {
        border-right: none;
      }
      .agent-card {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .on { background: #22c55e; color: white; }
      .off { background: #64748b; color: white; }
      .output {
        margin-top: 12px;
        padding: 10px;
        background: #111827;
        border-radius: 8px;
      }
      .question-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .question-form input {
        flex: 1;
        border: 1px solid #334155;
        background: #0b1220;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 10px;
      }
      .ask-btn {
        background: #0284c7;
        color: #ffffff;
      }
      .question-log {
        margin-top: 10px;
        font-size: 14px;
        color: #94a3b8;
      }
      .status {
        margin-top: 8px;
        font-size: 13px;
        color: #7dd3fc;
      }
      .error {
        margin-top: 8px;
        font-size: 13px;
        color: #fca5a5;
      }
      .trace-item {
        margin-top: 8px;
        padding: 8px;
        background: #1e293b;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h3>Agents</h3>
        <div id="agent-list"></div>
      </aside>
      <main class="panel">
        <h3>Agent Outputs</h3>
        <form id="question-form" class="question-form">
          <input id="question-input" type="text" placeholder="Ask a question for the agents" required />
          <button class="ask-btn" type="submit">Ask</button>
        </form>
        <div id="question-log" class="question-log"></div>
        <div id="status" class="status"></div>
        <div id="error" class="error"></div>
        <div id="outputs"></div>
      </main>
      <aside class="panel">
        <h3>Workflow Trace</h3>
        <div id="trace"></div>
      </aside>
    </div>
    <script type="module">
      import { createOrchestratorState, toggleAgent, runOrchestration, getActiveAgents } from '/src/app.js';

      const state = createOrchestratorState();
      const outputEl = document.getElementById('outputs');
      const traceEl = document.getElementById('trace');
      const agentListEl = document.getElementById('agent-list');
      const questionFormEl = document.getElementById('question-form');
      const questionInputEl = document.getElementById('question-input');
      const questionLogEl = document.getElementById('question-log');
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const askButtonEl = questionFormEl.querySelector('button[type="submit"]');

      const session = {
        currentQuestion: 'Investigate the mysterious package',
        history: [],
        latestResult: null,
        isLoading: false,
        error: ''
      };

      async function orchestrateQuestion(question) {
        const activeAgents = getActiveAgents(state);
        if (!activeAgents.length) {
          session.error = 'Turn on at least one agent before asking a question.';
          session.latestResult = { prompt: question, outputs: [], trace: [] };
          render();
          return;
        }

        session.isLoading = true;
        session.error = '';
        render();

        try {
          const response = await fetch('/api/orchestrate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, activeAgents })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Request failed.');
          }

          session.latestResult = data;
        } catch (error) {
          session.error = error.message;
          session.latestResult = runOrchestration(state, question);
        } finally {
          session.isLoading = false;
          render();
        }
      }

      function render() {
        agentListEl.innerHTML = '';
        outputEl.innerHTML = '';
        traceEl.innerHTML = '';
        statusEl.textContent = session.isLoading ? 'Agents are thinking...' : '';
        errorEl.textContent = session.error;
        askButtonEl.disabled = session.isLoading;
        askButtonEl.textContent = session.isLoading ? 'Thinking...' : 'Ask';
        questionLogEl.textContent = session.history.length
          ? `Last question: ${session.history[session.history.length - 1]}`
          : 'Ask your first question to start orchestration.';

        state.agents.forEach((agent) => {
          const card = document.createElement('div');
          card.className = 'agent-card';
          card.innerHTML = `
            <strong>${agent.name}</strong><br/>
            <button class="${agent.enabled ? 'on' : 'off'}" data-agent="${agent.id}">
              ${agent.enabled ? 'ON' : 'OFF'}
            </button>
          `;
          agentListEl.appendChild(card);
        });

        const result = session.latestResult || runOrchestration(state, session.currentQuestion);
        result.outputs.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'output';
          div.textContent = item.content;
          outputEl.appendChild(div);
        });

        result.trace.forEach((step) => {
          const div = document.createElement('div');
          div.className = 'trace-item';
          div.textContent = `${step.step} (${step.agentId})`;
          traceEl.appendChild(div);
        });
      }

      agentListEl.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        toggleAgent(state, button.dataset.agent);

        if (session.history.length) {
          orchestrateQuestion(session.currentQuestion);
          return;
        }

        render();
      });

      questionFormEl.addEventListener('submit', (event) => {
        event.preventDefault();
        const question = questionInputEl.value.trim();
        if (!question) return;

        session.currentQuestion = question;
        session.history.push(question);
        questionInputEl.value = '';
        orchestrateQuestion(question);
      });

      render();
    </script>
  </body>
</html>
