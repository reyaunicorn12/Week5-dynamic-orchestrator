<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Orchestrator</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');

      :root {
        --bg-deep: #071226;
        --bg-mid: #0d1b34;
        --glow-left: #164e63;
        --glow-right: #1d4ed8;
        --panel: rgba(12, 24, 46, 0.78);
        --panel-border: rgba(125, 211, 252, 0.22);
        --surface: rgba(14, 30, 57, 0.9);
        --surface-strong: #132746;
        --card-top: rgba(19, 39, 70, 0.96);
        --card-bottom: rgba(14, 31, 57, 0.94);
        --input-bg: rgba(8, 18, 36, 0.88);
        --trace-border: rgba(56, 189, 248, 0.14);
        --output-border: rgba(148, 163, 184, 0.2);
        --text-main: #e8f0ff;
        --text-soft: #a5badb;
        --accent: #22d3ee;
        --accent-strong: #0ea5e9;
        --ok: #34d399;
        --muted: #5b708f;
        --danger: #fda4af;
      }

      body[data-theme='light'] {
        --bg-deep: #eaf4ff;
        --bg-mid: #dceeff;
        --glow-left: #7dd3fc;
        --glow-right: #fca5a5;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-border: rgba(15, 23, 42, 0.12);
        --surface: rgba(255, 255, 255, 0.95);
        --surface-strong: #eef5ff;
        --card-top: rgba(255, 255, 255, 0.98);
        --card-bottom: rgba(239, 246, 255, 0.98);
        --input-bg: rgba(255, 255, 255, 0.94);
        --trace-border: rgba(14, 165, 233, 0.22);
        --output-border: rgba(148, 163, 184, 0.35);
        --text-main: #0f172a;
        --text-soft: #475569;
        --accent: #0ea5e9;
        --accent-strong: #0284c7;
        --danger: #dc2626;
      }

      body {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        background:
          radial-gradient(1200px 520px at -10% -10%, var(--glow-left) 0%, transparent 58%),
          radial-gradient(860px 420px at 110% 0%, var(--glow-right) 0%, transparent 54%),
          linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
        color: var(--text-main);
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        min-height: 100vh;
      }
      .panel {
        padding: 20px;
        border-right: 1px solid var(--panel-border);
        background: var(--panel);
        backdrop-filter: blur(6px);
      }
      .panel:last-child {
        border-right: none;
      }
      h3 {
        margin-top: 0;
        letter-spacing: 0.2px;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .theme-toggle {
        background: var(--surface);
        color: var(--text-main);
        border: 1px solid var(--panel-border);
      }
      .agent-card {
        background: linear-gradient(180deg, var(--card-top) 0%, var(--card-bottom) 100%);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 7px 12px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
      }
      .on {
        background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
        color: #06281b;
      }
      .off {
        background: linear-gradient(180deg, #64748b 0%, #475569 100%);
        color: #e2e8f0;
      }
      .output {
        margin-top: 12px;
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--output-border);
        border-radius: 10px;
        line-height: 1.35;
      }
      .question-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .question-form input {
        flex: 1;
        border: 1px solid var(--panel-border);
        background: var(--input-bg);
        color: var(--text-main);
        border-radius: 8px;
        padding: 11px;
        font-family: inherit;
      }
      .question-form input::placeholder {
        color: #7f96ba;
      }
      .question-form input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
      }
      .ask-btn {
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: #032438;
      }
      .question-log {
        margin-top: 10px;
        font-size: 14px;
        color: var(--text-soft);
      }
      .status {
        margin-top: 8px;
        font-size: 13px;
        color: var(--accent);
      }
      .error {
        margin-top: 8px;
        font-size: 13px;
        color: var(--danger);
      }
      .trace-item {
        margin-top: 8px;
        padding: 10px;
        background: var(--surface-strong);
        border: 1px solid var(--trace-border);
        border-radius: 8px;
      }
      @media (max-width: 1000px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .panel {
          border-right: none;
          border-bottom: 1px solid var(--panel-border);
        }
        .panel:last-child {
          border-bottom: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <div class="panel-header">
          <h3>Agents</h3>
          <button id="theme-toggle" class="theme-toggle" type="button">Light</button>
        </div>
        <div id="agent-list"></div>
      </aside>
      <main class="panel">
        <h3>Agent Outputs</h3>
        <form id="question-form" class="question-form">
          <input id="question-input" type="text" placeholder="Ask a question for the agents" required />
          <button class="ask-btn" type="submit">Ask</button>
        </form>
        <div id="question-log" class="question-log"></div>
        <div id="status" class="status"></div>
        <div id="error" class="error"></div>
        <div id="outputs"></div>
      </main>
      <aside class="panel">
        <h3>Workflow Trace</h3>
        <div id="trace"></div>
      </aside>
    </div>
    <script type="module">
      import { createOrchestratorState, toggleAgent, runOrchestration, getActiveAgents } from '/src/app.js';

      const state = createOrchestratorState();
      const outputEl = document.getElementById('outputs');
      const traceEl = document.getElementById('trace');
      const agentListEl = document.getElementById('agent-list');
      const questionFormEl = document.getElementById('question-form');
      const questionInputEl = document.getElementById('question-input');
      const questionLogEl = document.getElementById('question-log');
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const askButtonEl = questionFormEl.querySelector('button[type="submit"]');
      const themeToggleEl = document.getElementById('theme-toggle');

      const THEME_STORAGE_KEY = 'orchestrator-theme';

      function getCurrentTheme() {
        return document.body.dataset.theme === 'light' ? 'light' : 'dark';
      }

      function setTheme(theme) {
        document.body.dataset.theme = theme;
        themeToggleEl.textContent = theme === 'light' ? 'Dark' : 'Light';
        localStorage.setItem(THEME_STORAGE_KEY, theme);
      }

      function initializeTheme() {
        const saved = localStorage.getItem(THEME_STORAGE_KEY);
        setTheme(saved === 'light' ? 'light' : 'dark');
      }

      const session = {
        currentQuestion: 'Investigate the mysterious package',
        history: [],
        latestResult: null,
        isLoading: false,
        error: ''
      };

      async function orchestrateQuestion(question) {
        const activeAgents = getActiveAgents(state);
        if (!activeAgents.length) {
          session.error = 'Turn on at least one agent before asking a question.';
          session.latestResult = { prompt: question, outputs: [], trace: [] };
          render();
          return;
        }

        session.isLoading = true;
        session.error = '';
        render();

        try {
          const response = await fetch('/api/orchestrate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, activeAgents })
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Request failed.');
          }

          session.latestResult = data;
        } catch (error) {
          session.error = error.message;
          session.latestResult = runOrchestration(state, question);
        } finally {
          session.isLoading = false;
          render();
        }
      }

      function render() {
        agentListEl.innerHTML = '';
        outputEl.innerHTML = '';
        traceEl.innerHTML = '';
        statusEl.textContent = session.isLoading ? 'Agents are thinking...' : '';
        errorEl.textContent = session.error;
        askButtonEl.disabled = session.isLoading;
        askButtonEl.textContent = session.isLoading ? 'Thinking...' : 'Ask';
        questionLogEl.textContent = session.history.length
          ? `Last question: ${session.history[session.history.length - 1]}`
          : 'Ask your first question to start orchestration.';

        state.agents.forEach((agent) => {
          const card = document.createElement('div');
          card.className = 'agent-card';
          card.innerHTML = `
            <strong>${agent.name}</strong><br/>
            <button class="${agent.enabled ? 'on' : 'off'}" data-agent="${agent.id}">
              ${agent.enabled ? 'ON' : 'OFF'}
            </button>
          `;
          agentListEl.appendChild(card);
        });

        const result = session.latestResult || runOrchestration(state, session.currentQuestion);
        result.outputs.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'output';
          div.textContent = item.content;
          outputEl.appendChild(div);
        });

        result.trace.forEach((step) => {
          const div = document.createElement('div');
          div.className = 'trace-item';
          div.textContent = `${step.step} (${step.agentId})`;
          traceEl.appendChild(div);
        });
      }

      agentListEl.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        toggleAgent(state, button.dataset.agent);

        if (session.history.length) {
          orchestrateQuestion(session.currentQuestion);
          return;
        }

        render();
      });

      questionFormEl.addEventListener('submit', (event) => {
        event.preventDefault();
        const question = questionInputEl.value.trim();
        if (!question) return;

        session.currentQuestion = question;
        session.history.push(question);
        questionInputEl.value = '';
        orchestrateQuestion(question);
      });

      themeToggleEl.addEventListener('click', () => {
        const nextTheme = getCurrentTheme() === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);
      });

      initializeTheme();
      render();
    </script>
  </body>
</html>
